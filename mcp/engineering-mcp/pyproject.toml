[project]
name = "engineering-mcp"
version = "0.1.0"
description = "Narrow MCP environment controls for the engineering POC"
requires-python = ">=3.12"
dependencies = ["mcp>=2.1.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-anyio>=0.0.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
